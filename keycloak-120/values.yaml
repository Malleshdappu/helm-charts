name: keycloak120
dockerImage: mosipid/mosip-artemis-keycloak
dockerTag: 1.2.0.1 
keycloakUser: admin
keycloakPassword: '' # To be passed directly with helm command
domain: uat2.mosip.net
internalDomain: mzworker0.sb 
keycloakExternalUrl: "https://uat2.mosip.net/keycloak120/auth/"  
containerPort: 8080
exportLogs: enabled  # Let filebeat export the logs
servicePort: 80
db:
  name: keycloak120
  host: mzworker0.sb
  port: 30090
  user: postgres
  password: ''  # Passed from helm directly 
ingress:
   namespace: default
   path: keycloak120

services:
  keycloak:
    podconfig:
      maxSurge: 1
      maxUnavailable: 0
      minReadySeconds: 10
      replicas: 1

probe:
  period: 10 # Seconds
  timeout: 5
  livenessPeriod: 30
  failureThreshold: 15
  startupPeriod: 10
  initialDelaySeconds: 30

