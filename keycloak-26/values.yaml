name: keycloak26
dockerImage: quay.io/keycloak/keycloak
dockerTag: 26.7.4
keycloakUser: admin
keycloakPassword: '' # To be passed directly with helm command
domain: uat2.mosip.net
internalDomain: mzworker0.sb 
keycloakExternalUrl: "https://uat2.mosip.net/keycloak26/auth/"  
containerPort: 8080
exportLogs: enabled  # Let filebeat export the logs
servicePort: 80
db:
  name: keycloak26
  host: 13.234.32.74
  port: 5432
  user: postgres
  password: ''  # Passed from helm directly 
ingress:
   namespace: default
   path: keycloak26

keycloak:
  httpEnabled: "true"
  httpRelativePath: "/auth"
  proxyHeaders: "xforwarded"
  hostname: "https://uat2.mosip.net/keycloak26/auth"
  healthEnabled: "true"

services:
  keycloak:
    podconfig:
      maxSurge: 1
      maxUnavailable: 0
      minReadySeconds: 10
      replicas: 1

probe:
  period: 10 # Seconds
  timeout: 5
  livenessPeriod: 30
  failureThreshold: 15
  startupPeriod: 10
  initialDelaySeconds: 30

